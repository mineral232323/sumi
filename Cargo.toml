[package]
name = "sumi"
version = "0.1.0"
edition = "2021"
description = "Sumi — a lightweight handwritten notebook for Linux"
license = "MIT"
rust-version = "1.92"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
cairo-rs = { version = "0.22", features = ["pdf"] }
glib = "0.22"
gio = "0.22"
poppler = { package = "poppler-rs", version = "0.26" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
